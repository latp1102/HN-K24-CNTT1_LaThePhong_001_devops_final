# =============================================================================
#  Cấu hình ứng dụng - mọi giá trị được đọc từ BIẾN MÔI TRƯỜNG
#  (docker-compose.yml phải truyền các biến DB_* vào container)
# =============================================================================
spring.application.name=devops-final-app
server.port=8081

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.hikari.initialization-fail-timeout=60000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
